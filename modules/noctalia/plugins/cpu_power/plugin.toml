id          = "local/cpu_power"
name        = "CPU Power"
version     = "1.1.0"
plugin_api  = 23 # readFileAsync
author      = "local"
icon        = "bolt"
description = "CPU package power draw, published by the cpu-power system service."

[[widget]]
id    = "power"
entry = "widget.luau"

  [[widget.setting]]
  key       = "graph"
  type      = "bool"
  label_key = "settings.graph.label"
  default   = true
