# Noctalia GUI settings, pulled from ~/.local/state/noctalia/settings.toml
# by update-noctalia-config.sh. Layers over the Nix-generated config.toml
# (see noctalia.nix); remove a key here to hand it back to Nix.

[bar.main]
center = [ "disk", "cpu-power", "temp", "cpu", "gpu", "ram", "net-down", "net-up", "sysmon" ]
end = [ "bluetooth", "network", "battery", "brightness", "volume", "clock", "settings" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1440.0
    cy = 1738.0
    output = "eDP-1"
    placement_height = 1920.0
    placement_width = 2880.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
history_retention_hours = 1

[widget.clock]
format = "{:%a %b %e} {:%H:%M}"

[widget.cpu]
custom_label = "CPU"
interactive = false
show_glyph = false
visualization = "graph"

[widget.cpu-power]
interactive = false

[widget.disk]
interactive = false

[widget.gpu]
custom_label = "GPU"
interactive = false
show_glyph = false
visualization = "graph"

[widget.net-down]
interactive = false
visualization = "graph"

[widget.net-up]
interactive = false
visualization = "graph"

[widget.ram]
custom_label = "RAM"
interactive = false
show_glyph = false
visualization = "graph"

[widget.sysmon]
glyph = "activity-heartbeat"
show_value = false
visualization = "none"

[widget.temp]
interactive = false
visualization = "graph"

[widget.tray]
drawer = true
